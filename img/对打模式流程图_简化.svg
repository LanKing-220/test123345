<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Microsoft YaHei", sans-serif; fill: #111827; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 14; ry: 14; }
      .decision { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.5; }
      .text { font: 22px "Microsoft YaHei", sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 18px "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { font: 18px "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="540"/>
  <text x="640" y="42" class="title" text-anchor="middle">对打模式简化流程图</text>

  <rect class="box" x="60" y="130" width="170" height="74"/>
  <text class="text" x="145" y="167">进入对打模式</text>

  <rect class="box" x="280" y="130" width="180" height="74"/>
  <text class="text" x="370" y="157">检测球员目标</text>
  <text class="small" x="370" y="184">获得跟踪主体</text>

  <rect class="box" x="510" y="130" width="190" height="74"/>
  <text class="text" x="605" y="157">云台跟踪球员</text>
  <text class="small" x="605" y="184">保持目标居中</text>

  <polygon class="decision" points="845,105 955,167 845,229 735,167"/>
  <text class="text" x="845" y="157">检测到球拍</text>
  <text class="small" x="845" y="185">满足发球条件</text>

  <rect class="box" x="1005" y="130" width="190" height="74"/>
  <text class="text" x="1100" y="157">发送发球指令</text>
  <text class="small" x="1100" y="184">并完成计数</text>

  <polygon class="decision" points="1100,285 1210,347 1100,409 990,347"/>
  <text class="text" x="1100" y="337">达到设定次数</text>
  <text class="small" x="1100" y="365">是否结束本轮</text>

  <rect class="box" x="1015" y="450" width="170" height="62"/>
  <text class="text" x="1100" y="481">返回捡球模式</text>

  <line class="line" x1="230" y1="167" x2="280" y2="167"/>
  <line class="line" x1="460" y1="167" x2="510" y2="167"/>
  <line class="line" x1="700" y1="167" x2="735" y2="167"/>
  <line class="line" x1="955" y1="167" x2="1005" y2="167"/>
  <path class="line" d="M1100 204 L1100 285"/>
  <path class="line" d="M1100 409 L1100 450"/>

  <path class="line" d="M790 229 L790 300 L605 300 L605 204"/>
  <text class="note" x="710" y="290">否：继续跟踪并检测</text>

  <path class="line" d="M990 347 L920 347 L920 240 L605 240"/>
  <text class="note" x="885" y="329">否：进入下一轮等待</text>

  <path class="line" d="M1185 481 L1230 481 L1230 95 L370 95 L370 130"/>
  <text class="note" x="1210" y="462">是：模式切换</text>
</svg>
