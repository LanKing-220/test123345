<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Microsoft YaHei", sans-serif; fill: #111827; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 14; ry: 14; }
      .decision { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; }
      .text { font: 22px "Microsoft YaHei", sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 18px "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { font: 18px "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="520"/>
  <text x="640" y="42" class="title" text-anchor="middle">捡球模式简化流程图</text>

  <rect class="box" x="60" y="120" width="170" height="74"/>
  <text class="text" x="145" y="157">进入捡球模式</text>

  <rect class="box" x="280" y="120" width="180" height="74"/>
  <text class="text" x="370" y="157">云台扫描场地</text>

  <rect class="box" x="510" y="120" width="180" height="74"/>
  <text class="text" x="600" y="157">FOMO检测网球</text>

  <polygon class="decision" points="810,95 920,157 810,219 700,157"/>
  <text class="text" x="810" y="147">发现有效目标</text>
  <text class="small" x="810" y="175">候选是否可用</text>

  <rect class="box" x="970" y="120" width="190" height="74"/>
  <text class="text" x="1065" y="148">锁定并跟踪目标</text>
  <text class="small" x="1065" y="176">调整云台保持居中</text>

  <polygon class="decision" points="1065,265 1175,327 1065,389 955,327"/>
  <text class="text" x="1065" y="317">进入捡球范围</text>
  <text class="small" x="1065" y="345">距离是否满足</text>

  <rect class="box" x="970" y="430" width="190" height="62"/>
  <text class="text" x="1065" y="461">发送捡球指令</text>

  <line class="line" x1="230" y1="157" x2="280" y2="157"/>
  <line class="line" x1="460" y1="157" x2="510" y2="157"/>
  <line class="line" x1="690" y1="157" x2="700" y2="157"/>
  <line class="line" x1="920" y1="157" x2="970" y2="157"/>
  <path class="line" d="M1065 194 L1065 265"/>
  <path class="line" d="M1065 389 L1065 430"/>

  <path class="line" d="M760 219 L760 470 L370 470 L370 194"/>
  <text class="note" x="605" y="458">否：继续扫描</text>

  <path class="line" d="M955 327 L890 327 L890 230 L1065 230"/>
  <text class="note" x="900" y="309">否：继续跟踪</text>

  <path class="line" d="M1160 461 L1220 461 L1220 88 L370 88 L370 120"/>
  <text class="note" x="1210" y="442">完成后返回扫描</text>
</svg>
