<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="420" viewBox="0 0 1420 420">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 30px "Microsoft YaHei", sans-serif; fill: #111827; }
      .boxA { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.5; rx: 14; ry: 14; }
      .boxB { fill: #ecfeff; stroke: #0f766e; stroke-width: 2.5; rx: 14; ry: 14; }
      .boxC { fill: #f0fdf4; stroke: #15803d; stroke-width: 2.5; rx: 14; ry: 14; }
      .boxD { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; rx: 14; ry: 14; }
      .text { font: 22px "Microsoft YaHei", sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 18px "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1420" height="420"/>
  <text x="710" y="46" class="title" text-anchor="middle">FOMO轻量化模型架构图</text>

  <rect class="boxA" x="40" y="150" width="170" height="104"/>
  <text class="text" x="125" y="182">输入图像</text>
  <text class="small" x="125" y="214">96 × 96 × 3</text>

  <rect class="boxA" x="260" y="138" width="185" height="128"/>
  <text class="text" x="352" y="170">Stage 1</text>
  <text class="small" x="352" y="198">Conv2D 3×3 / 2</text>
  <text class="small" x="352" y="224">BN + ReLU</text>
  <text class="small" x="352" y="250">48 × 48 × 8</text>

  <rect class="boxB" x="495" y="138" width="190" height="128"/>
  <text class="text" x="590" y="170">Stage 2</text>
  <text class="small" x="590" y="198">SeparableConv2D 3×3 / 2</text>
  <text class="small" x="590" y="224">BN + ReLU</text>
  <text class="small" x="590" y="250">24 × 24 × 16</text>

  <rect class="boxB" x="735" y="138" width="190" height="128"/>
  <text class="text" x="830" y="170">Stage 3</text>
  <text class="small" x="830" y="198">SeparableConv2D 3×3 / 2</text>
  <text class="small" x="830" y="224">BN + ReLU</text>
  <text class="small" x="830" y="250">12 × 12 × 24</text>

  <rect class="boxC" x="975" y="138" width="190" height="128"/>
  <text class="text" x="1070" y="170">特征头</text>
  <text class="small" x="1070" y="198">SeparableConv2D 3×3 / 1</text>
  <text class="small" x="1070" y="224">BN + ReLU</text>
  <text class="small" x="1070" y="250">12 × 12 × 32</text>

  <rect class="boxD" x="1215" y="126" width="170" height="152"/>
  <text class="text" x="1300" y="158">检测头</text>
  <text class="small" x="1300" y="186">Conv2D 1×1 / 1</text>
  <text class="small" x="1300" y="212">Sigmoid</text>
  <text class="small" x="1300" y="240">输出热力图</text>
  <text class="small" x="1300" y="266">12 × 12 × 4</text>

  <rect class="boxD" x="1185" y="320" width="230" height="56"/>
  <text class="small" x="1300" y="348">background / Tennis / Tennis player / Tennis racket</text>

  <line class="line" x1="210" y1="202" x2="260" y2="202"/>
  <line class="line" x1="445" y1="202" x2="495" y2="202"/>
  <line class="line" x1="685" y1="202" x2="735" y2="202"/>
  <line class="line" x1="925" y1="202" x2="975" y2="202"/>
  <line class="line" x1="1165" y1="202" x2="1215" y2="202"/>
</svg>
